{{- include "monize.assertPostgresql" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-vars-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "monize.backend.labels" . | nindent 4 }}
data:
  # App
  NODE_ENV: {{ .Values.backend.app.NODE_ENV | quote }}
  PUBLIC_APP_URL: {{ .Values.backend.app.PUBLIC_APP_URL | default (include "monize.publicAppUrl" .) | quote }}
  # Database
  DATABASE_HOST: {{ include "monize.databaseHost" . | quote }}
  DATABASE_NAME: {{ include "monize.databaseName" . | quote }}
  {{- if include "monize.postgresManaged" . }}
  {{- /*
    An operator-managed database is served over TLS by both operators, and the
    backend only uses it when told to, so it is told to. Whether it also checks
    who answered turns on having a CA to check against: with one, a certificate
    that does not chain to it is refused; without one -- Zalando's Spilo issues
    a self-signed certificate -- the connection is encrypted and unverified,
    and NOTES.txt says so.

    The CA file is a PEM the backend trusts for its database connections only,
    never for its other outbound requests; the Deployment mounts it at the path
    named here (monize.databaseCaDir keeps the two in step).
  */}}
  {{- $caSecret := include "monize.databaseCaSecret" . }}
  DATABASE_SSL: "true"
  {{- if $caSecret }}
  DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
  DATABASE_SSL_CA_FILE: {{ printf "%s/ca.crt" (include "monize.databaseCaDir" .) | quote }}
  {{- else }}
  DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
  {{- end }}
  {{- end }}
  # Horizontal scaling. In multi the backend keeps rate limits, single-use
  # claims and the relay on rows, and wakes other replicas over LISTEN/NOTIFY --
  # so DATABASE_HOST above must reach a PostgreSQL session, not a
  # transaction-mode pooler. The two assertions are the operator stating that
  # the attachment and backup directories are mounted by every replica; nothing
  # inside a container can observe that, and multi refuses to boot without them.
  # They are tested for the exact value "true" rather than for truthiness: the
  # string "false" is truthy in a template, and emitting BACKUP_SHARED_VOLUME=true
  # because somebody quoted the value would convert that boot refusal into two
  # replicas writing backups to two different disks and each seeing half.
  CLUSTER_MODE: {{ .Values.cluster.mode | quote }}
  {{- if eq (include "monize.isTrue" .Values.cluster.attachmentSharedVolume) "true" }}
  ATTACHMENT_SHARED_VOLUME: "true"
  {{- end }}
  {{- if eq (include "monize.isTrue" .Values.cluster.backupSharedVolume) "true" }}
  BACKUP_SHARED_VOLUME: "true"
  {{- end }}
  # Row-Level Security (mode + runtime role name; password lives in the DB Secret)
  RLS_MODE: {{ .Values.backend.rls.RLS_MODE | default "off" | quote }}
  DATABASE_APP_USER: {{ .Values.backend.rls.DATABASE_APP_USER | default "monize_app" | quote }}
  # Auth
  LOCAL_AUTH_ENABLED: {{ .Values.backend.auth.LOCAL_AUTH_ENABLED | quote }}
  REGISTRATION_ENABLED: {{ .Values.backend.auth.REGISTRATION_ENABLED | quote }}
  {{- if or .Values.backend.oidc.OIDC_ISSUER_URL .Values.backend.oidc.OIDC_CALLBACK_URL }}
  # OIDC
  {{- if .Values.backend.oidc.OIDC_ISSUER_URL }}
  OIDC_ISSUER_URL: {{ .Values.backend.oidc.OIDC_ISSUER_URL | quote }}
  {{- end }}
  {{- if .Values.backend.oidc.OIDC_CALLBACK_URL }}
  OIDC_CALLBACK_URL: {{ .Values.backend.oidc.OIDC_CALLBACK_URL | quote }}
  {{- end }}
  {{- end }}
  # Microsoft Money (.mny) import
  {{- $mnyImport := .Values.backend.mnyImport | default dict }}
  MNY_IMPORT_LIMIT_MB: {{ $mnyImport.MNY_IMPORT_LIMIT_MB | default "300" | quote }}
  # SMTP
  SMTP_HOST: {{ .Values.backend.smtp.SMTP_HOST | quote }}
  SMTP_PORT: {{ .Values.backend.smtp.SMTP_PORT | quote }}
  SMTP_SECURE: {{ .Values.backend.smtp.SMTP_SECURE | quote }}
  EMAIL_FROM: {{ .Values.backend.smtp.EMAIL_FROM | quote }}
